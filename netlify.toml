[build]
  publish = "public"
  # Portrait images were uploaded to /portraits; copy them where the site expects them.
  command = "mkdir -p public/img/portraits && cp portraits/*.jpg public/img/portraits/"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Basic security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
